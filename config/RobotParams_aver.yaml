/**:
  ros__parameters:
    # Robot Identification
    robot_name: "aver"

    # Physical Chassis Parameters
    wheel_diameter: 0.08
    wheel_base: 0.175

    # Motor Specifications
    left_max_rpm: 60.0
    right_max_rpm: 60.0

    left_ticks_per_rotation: 620.0
    right_ticks_per_rotation: 620.0

    # GPIO Pin Out
    left_forward_pin: 18
    left_backward_pin: 23
    right_forward_pin: 24
    right_backward_pin: 25

    # Teleop Command Scales
    linear_scale: 0.8
    angular_scale: 2.5

    # Deadband Compensation Parameters (Per-Robot Minimum PWM)
    min_pwm_left: 0.30
    min_pwm_right: 0.32

     # PID Tuning Parameters
    pid_left_p: 0.55
    pid_left_i: 0.05
    pid_left_d: 0.00

    pid_right_p: 0.65
    pid_right_i: 0.05
    pid_right_d: 0.001
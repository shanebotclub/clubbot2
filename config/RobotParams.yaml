/**:
  ros__parameters:
    # Robot Identification
    robot_name: "aver"

    # Physical Chassis Parameters
    wheel_diameter: 0.08
    wheel_base: 0.175

    # Motor Specifications
    left_max_rpm: 107
    right_max_rpm: 107

    left_ticks_per_rotation: 620
    right_ticks_per_rotation: 620

    # GPIO Pin Out
    left_forward_pin: 18
    left_backward_pin: 23
    right_forward_pin: 24
    right_backward_pin: 25

    # Teleop Command Scales
    linear_scale: 0.28
    angular_scale: 1.0

    # Deadband Compensation Parameters (Per-Robot Minimum PWM)
    min_pwm_left: 0.12
    min_pwm_right: 0.12

    # PID Tuning Parameters
    pid_left_p: 0.25
    pid_left_i: 0.001
    pid_left_d: 0.0

    pid_right_p: 0.35
    pid_right_i: 0.001
    pid_right_d: 0.0
  

